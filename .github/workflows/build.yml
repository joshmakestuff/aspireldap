name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs for every push, PR, and tag — a tagged commit is never published untested.
  test:
    # ubuntu-latest (24.04+) ships only the upstream libldap.so.2 soname. The integrations
    # register a DllImportResolver that finds it, so no libldap install/symlink step is
    # needed — running here is what proves the resolver works on a 2.6-only distro (#8).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: aspireOpenLdap
        run: dotnet restore AspireOpenLdap.slnx

      # Pinned in aspireOpenLdap/dotnet-tools.json: reportgenerator (coverage merge) and
      # dotnet-stryker (used by the mutation job).
      - name: Restore local tools
        working-directory: aspireOpenLdap
        run: dotnet tool restore

      - name: Verify formatting
        working-directory: aspireOpenLdap
        run: dotnet format AspireOpenLdap.slnx --verify-no-changes --no-restore

      - name: Build
        working-directory: aspireOpenLdap
        run: dotnet build AspireOpenLdap.slnx --configuration Release --no-restore

      # The fast suite must pass without Docker; nothing in it may start a container.
      # Category=CleanConsumer is excluded too — it packs and boots a full AppHost, and runs
      # as its own publish-gating job below.
      # Coverage (#64): first-party assemblies only (see coverage.runsettings for the
      # denominator and limitations — container/child-process work is not in this number,
      # and there is deliberately no threshold). Published as a diagnostic artifact.
      - name: Fast tests
        working-directory: aspireOpenLdap
        run: >
          dotnet test AspireOpenLdap.slnx --configuration Release --no-build
          --filter "Category!=Integration&Category!=CleanConsumer"
          --collect "XPlat Code Coverage" --settings coverage.runsettings
          --results-directory ../artifacts/test-results

      # The runsettings' first-party claim is asserted, not trusted: if the Include filter
      # drifts and framework assemblies re-enter the denominator, this fails the build.
      #
      # Allow-list, not exact equality: every covered package must be first-party, but an
      # assembly with no executed code yet (Aspire.LdapAdmin.Core lands via #81 on another
      # branch) is not required to appear. That keeps the guard strict in the direction that
      # matters — nothing third-party can enter the denominator — without breaking whenever a
      # first-party assembly is added or is momentarily empty.
      - name: Assert coverage counts only first-party assemblies
        run: |
          allowed='Aspire.OpenLdap Aspire.Hosting.OpenLdap Aspire.LdapAdmin.Core Aspire.LdapAdmin.Web'
          packages=$(grep -hoP 'package name="\K[^"]+' artifacts/test-results/*/coverage.cobertura.xml | sort -u)
          echo "covered packages:"; echo "$packages"
          status=0
          for p in $packages; do
            case " $allowed " in
              *" $p "*) ;;
              *) echo "::error::non-first-party assembly '$p' entered the coverage denominator"; status=1 ;;
            esac
          done
          exit $status

      # One test run per test project produces one cobertura file each, and a project that
      # exercises none of the included assemblies emits a 0%-of-everything file. Reporting any
      # single file would therefore be wrong; merge them into one union before quoting a number.
      - name: Merge coverage into one first-party report
        working-directory: aspireOpenLdap
        run: >
          dotnet reportgenerator
          "-reports:../artifacts/test-results/*/coverage.cobertura.xml"
          "-targetdir:../artifacts/coverage-report"
          "-reporttypes:Cobertura;TextSummary;MarkdownSummaryGithub"

      # Display the number WITH its denominator and its limitations, so the percentage cannot
      # be quoted out of context from the job summary.
      - name: Publish coverage summary
        run: |
          {
            echo "## Fast-suite coverage (diagnostic — not a gate)"
            echo
            cat artifacts/coverage-report/SummaryGithub.md
            echo
            echo "### How to read this number"
            echo
            echo "- **Denominator:** first-party shipped assemblies only"
            echo "  (\`Aspire.OpenLdap\`, \`Aspire.Hosting.OpenLdap\`, \`Aspire.LdapAdmin.*\`)."
            echo "  Framework/Aspire packages and the test AppHosts are excluded — see"
            echo "  \`aspireOpenLdap/coverage.runsettings\`."
            echo "- **Scope:** the FAST suite only (\`Category!=Integration\`), measured in-process."
            echo "- **Limitation:** Docker containers and child AppHost processes execute outside the"
            echo "  collector, so behavior the integration suite proves is *structurally invisible* here."
            echo "  A low number for a container-facing type does not mean it is untested."
            echo "- **No threshold is enforced.** Contract protection is enforced by the targeted"
            echo "  mutation runs instead (see the \`mutation\` job and \`docs/testing.md\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fast-suite coverage (diagnostic)
        uses: actions/upload-artifact@v7
        with:
          name: fast-suite-coverage
          path: |
            artifacts/test-results/**/coverage.cobertura.xml
            artifacts/coverage-report/Cobertura.xml
            artifacts/coverage-report/Summary.txt
          if-no-files-found: error

      # Docker-backed integration tests. Direct-docker classes share one bundled-image build
      # (BundledImage); the AppHost tests build theirs through Aspire on first use.
      - name: Integration tests
        working-directory: aspireOpenLdap
        run: dotnet test AspireOpenLdap.slnx --configuration Release --no-build --filter "Category=Integration"

      # Build the examples so they can't rot against the library. Build-only (no Docker / no run).
      - name: Build examples
        run: dotnet build examples/AspireOpenLdap.Examples.slnx --configuration Release

  # Targeted mutation testing (#64). Deliberately NOT a broad mutation run: only the
  # deterministic pure boundaries where a surviving mutant means a real unprotected contract
  # (connection-string parse/quote, DN/input validation, certificate hostname validation, LDIF
  # generation). The configs exclude Category=Integration, so no container is ever started here
  # — a mutation run that needed Docker would be neither fast nor honest about what killed the
  # mutant. Break thresholds are the measured first-party baselines; the survivor policy is in
  # docs/testing.md. Runs as its own job so a mutation regression is legible on its own.
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: aspireOpenLdap
        run: dotnet restore AspireOpenLdap.slnx

      - name: Restore local tools
        working-directory: aspireOpenLdap
        run: dotnet tool restore

      - name: Mutate client pure boundaries
        working-directory: aspireOpenLdap
        run: dotnet stryker --config-file stryker-config.client.json --output ../artifacts/stryker/client

      - name: Mutate hosting pure boundaries
        working-directory: aspireOpenLdap
        # Runs even when the client leg fails, so one report is not hidden behind the other.
        if: ${{ !cancelled() }}
        run: dotnet stryker --config-file stryker-config.hosting.json --output ../artifacts/stryker/hosting

      - name: Upload mutation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-reports
          path: artifacts/stryker/*/reports/mutation-report.json
          # warn, not error: a leg that fails before writing its report must surface as the
          # mutation failure it is, not as a second confusing upload failure.
          if-no-files-found: warn

  # Windows fast-suite witness (#64): the client stack sits on a different native LDAP
  # implementation per OS (wldap32 on Windows vs libldap on Linux), so Linux-only CI left
  # the Windows paths unwitnessed.
  #
  # Integration deliberately stays on ubuntu. GitHub-hosted windows-latest runners run the
  # Windows container engine and cannot start the Linux OpenLDAP image, so "Windows runs the
  # single integration command" is not achievable on hosted runners at all — it needs a
  # self-hosted Windows runner with Docker Desktop in Linux-container mode (see #64/#54, which
  # recorded the orchestration failure observed there). This leg is the per-PR Windows witness
  # that IS available, and it is a required dependency of publish below.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: aspireOpenLdap
        run: dotnet restore AspireOpenLdap.slnx

      - name: Build
        working-directory: aspireOpenLdap
        run: dotnet build AspireOpenLdap.slnx --configuration Release --no-restore

      - name: Fast tests
        working-directory: aspireOpenLdap
        run: dotnet test AspireOpenLdap.slnx --configuration Release --no-build --filter "Category!=Integration&Category!=CleanConsumer"

  # The clean-consumer packed-artifact test (#82): packs the hosting package, restores it into
  # a scaffolded consumer AppHost in an isolated temp workspace (local feed + nuget.org only),
  # and runs AddOpenLdap(...).WithLdapAdmin() end to end from package-delivered assets. Its own
  # job — not part of the integration step — so a packaging regression (missing payload file,
  # checkout-relative path) is legible on its own, and publish is gated on it explicitly.
  clean-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: aspireOpenLdap
        run: dotnet restore AspireOpenLdap.slnx

      - name: Build
        working-directory: aspireOpenLdap
        run: dotnet build AspireOpenLdap.slnx --configuration Release --no-restore

      - name: Clean-consumer packed-artifact test
        working-directory: aspireOpenLdap
        run: dotnet test AspireOpenLdap.slnx --configuration Release --no-build --filter "Category=CleanConsumer"

  pack:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Compute package version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            BASE=$(grep -oP '(?<=<Version>)[^<]+' aspireOpenLdap/Directory.Build.props)
            VERSION="${BASE}.ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION}"

      - name: Restore
        working-directory: aspireOpenLdap
        run: dotnet restore AspireOpenLdap.slnx

      - name: Pack
        working-directory: aspireOpenLdap
        run: |
          dotnet pack AspireOpenLdap.slnx \
            --configuration Release \
            --no-restore \
            -p:Version=${{ steps.ver.outputs.version }} \
            -p:ContinuousIntegrationBuild=true \
            --output ../artifacts

      - name: Upload nupkg artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  # Publishes the artifacts packed from the exact tagged commit, and only after the
  # test job (unit + Docker integration + example build), the Windows fast-suite witness,
  # the targeted mutation run, and the clean-consumer packed-artifact test have all passed
  # on that commit.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, test-windows, mutation, pack, clean-consumer]
    permissions:
      contents: read
      id-token: write   # OIDC trusted publishing to nuget.org — scoped to this job only
    steps:
      - name: Download nupkg artifacts
        uses: actions/download-artifact@v8
        with:
          name: nupkgs
          path: artifacts

      # Trusted publishing: exchange a GitHub OIDC token for a short-lived nuget.org
      # API key (valid ~1h). No long-lived secret stored in the repo. Requires a
      # trusted publishing policy on nuget.org bound to this repo + workflow file.
      - name: NuGet login (OIDC → short-lived key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}   # your nuget.org username (profile name), not email

      - name: Push to nuget.org
        working-directory: artifacts
        run: |
          dotnet nuget push '*.nupkg' \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --skip-duplicate
